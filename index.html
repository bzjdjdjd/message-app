<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>短信</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",
  "Microsoft YaHei",sans-serif
}

.phone{
  width:100%;
  max-width:520px;
  height:100vh;
  height:100dvh;
  margin:auto;
  background:#000;
  display:flex;
  flex-direction:column;
  overflow:hidden
}

.top{
  height:126px;
  flex:none;
  padding:12px 22px 0;
  display:flex;
  justify-content:space-between;
  align-items:flex-start
}

.back,.camera{
  border:0;
  color:#fff;
  background:#202023;
  cursor:pointer
}

.back{
  width:82px;
  height:48px;
  border-radius:28px;
  display:flex;
  align-items:center;
  gap:8px;
  padding-left:13px;
  font-size:38px
}

.back b{
  width:30px;
  height:30px;
  border-radius:50%;
  background:#fff;
  color:#222;
  display:grid;
  place-items:center;
  font-size:17px
}

.camera{
  width:54px;
  height:54px;
  border-radius:50%;
  border:1px solid #444;
  font-size:27px
}

.profile{
  text-align:center;
  margin-top:-2px
}

.avatar{
  width:82px;
  height:82px;
  border-radius:50%;
  margin:auto;
  background:linear-gradient(#aaa8bd,#39364f);
  position:relative
}

.avatar:before{
  content:"";
  position:absolute;
  top:17px;
  left:28px;
  width:27px;
  height:27px;
  border-radius:50%;
  background:#fff
}

.avatar:after{
  content:"";
  position:absolute;
  left:15px;
  bottom:12px;
  width:52px;
  height:25px;
  border-radius:50% 50% 45% 45%;
  background:#fff
}

.number{
  min-width:220px;
  margin:3px auto 0;
  padding:8px 14px;
  border-radius:22px;
  background:#202023;
  font-size:18px;
  color:#eee
}

.info{
  flex:none;
  text-align:center;
  color:#929298;
  font-size:13px;
  margin:25px 0 14px
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:0 25px 20px;
  scrollbar-width:none
}

.messages::-webkit-scrollbar{display:none}

.row{
  display:flex;
  margin:10px 0
}

.row.me{justify-content:flex-end}

.bubble{
  position:relative;
  max-width:82%;
  padding:10px 15px;
  border-radius:23px;
  background:#29292d;
  color:#fff;
  font-size:19px;
  line-height:1.4;
  word-break:break-word
}

.row.me .bubble{background:#168df5}

.row:not(.me) .bubble:after{
  content:"";
  position:absolute;
  left:5px;
  bottom:-7px;
  width:18px;
  height:15px;
  background:#29292d;
  clip-path:polygon(0 0,100% 0,0 100%)
}

.row.me .bubble:after{
  content:"";
  position:absolute;
  right:5px;
  bottom:-7px;
  width:18px;
  height:15px;
  background:#168df5;
  clip-path:polygon(0 0,100% 0,100% 100%)
}

.composer{
  flex:none;
  padding:8px 18px max(16px,env(safe-area-inset-bottom));
  display:flex;
  gap:10px;
  align-items:center
}

.plus{
  width:50px;
  height:50px;
  border:1px solid #444;
  border-radius:50%;
  background:#222225;
  color:#fff;
  font-size:34px;
  cursor:pointer
}

.inputbox{
  flex:1;
  min-height:50px;
  border-radius:28px;
  background:#202023;
  border:1px solid #333;
  display:flex;
  align-items:center;
  padding:0 8px 0 17px
}

input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:18px
}

input::placeholder{color:#77777d}

.icon{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#aaa;
  font-size:23px;
  cursor:pointer
}

.send{
  background:#178df5;
  color:#fff
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:5;
  background:rgba(0,0,0,.9);
  align-items:center;
  justify-content:center;
  padding:22px
}

.modal.show{display:flex}

.card{
  width:min(430px,100%);
  border-radius:28px;
  background:#202023;
  padding:28px 22px;
  text-align:center
}

.card h2{
  margin:10px 0;
  font-size:23px
}

.card input{
  width:100%;
  height:48px;
  margin:7px 0;
  padding:0 15px;
  border-radius:14px;
  background:#333338;
  font-size:17px
}

.card button{
  min-height:44px;
  margin-top:10px;
  padding:0 18px;
  border:0;
  border-radius:14px;
  background:#168df5;
  color:#fff;
  font-size:16px;
  cursor:pointer
}

.card .cancel{background:#444}

.menu button{
  display:block;
  width:100%;
  margin:10px 0
}

.call-avatar{
  margin:0 auto 15px
}

#callVideo{
  display:none;
  width:100%;
  max-height:280px;
  border-radius:20px;
  background:#000;
  object-fit:cover
}

.call-actions{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:20px
}

.call-actions button{
  width:60px;
  height:60px;
  padding:0;
  border-radius:50%;
  font-size:24px
}

.call-actions .accept{background:#21b866}
.call-actions .reject{background:#e53935}
</style>
</head>

<body>

<div class="phone">

  <header class="top">
    <button class="back" id="back">‹ <b>6</b></button>

    <div class="profile">
      <div class="avatar"></div>
      <div class="number" id="contactNumber">+86 138 0000 0000</div>
    </div>

    <button class="camera" id="startVideo">▣</button>
  </header>

  <div class="info">
    iMessage 信息<br>
    <span id="date"></span>
  </div>

  <main class="messages" id="messages">
    <div class="row me"><div class="bubble">最近过得怎么样</div></div>
    <div class="row"><div class="bubble">就那样</div></div>
    <div class="row"><div class="bubble">不怎么好</div></div>
    <div class="row me"><div class="bubble">越来越冷了</div></div>
    <div class="row"><div class="bubble">是啊</div></div>
    <div class="row"><div class="bubble">你是怎么找到的</div></div>
    <div class="row me"><div class="bubble">我想过你会猜到我是谁</div></div>
    <div class="row"><div class="bubble">直觉</div></div>
    <div class="row me"><div class="bubble">嗯 祝你一切都好</div></div>
    <div class="row"><div class="bubble">没有什么想说的吗</div></div>
    <div class="row me"><div class="bubble">有很多</div></div>
    <div class="row"><div class="bubble">我也是</div></div>
    <div class="row"><div class="bubble">对不起 怪我离你太远</div></div>
    <div class="row"><div class="bubble">祝你有个好的转弯</div></div>
  </main>

  <form class="composer" id="form">
    <button class="plus" id="plus" type="button">+</button>

    <div class="inputbox">
      <input id="input" placeholder="iMessage 信息" autocomplete="off">
      <button class="icon" id="voice" type="button">⌕</button>
      <button class="icon send" type="submit">↑</button>
    </div>
  </form>

</div>

<!-- 新建短信弹窗 -->
<div class="modal" id="newMessageModal">
  <div class="card">
    <h2>新建短信</h2>
    <input id="newName" placeholder="联系人名称">
    <input id="newNumber" placeholder="手机号码">
    <button id="createMessage">开始短信</button>
    <button class="cancel" data-close="newMessageModal">取消</button>
  </div>
</div>

<!-- 加号菜单 -->
<div class="modal" id="menuModal">
  <div class="card menu">
    <h2>更多功能</h2>
    <button id="newMessage">新建短信联系人</button>
    <button id="incomingCall">模拟视频来电</button>
    <button class="cancel" data-close="menuModal">取消</button>
  </div>
</div>

<!-- 通话弹窗 -->
<div class="modal" id="callModal">
  <div class="card">
    <div class="avatar call-avatar"></div>
    <h2 id="callTitle">视频通话</h2>
    <p id="callStatus">正在连接</p>

    <video id="callVideo" autoplay muted playsinline></video>

    <div class="call-actions" id="incomingActions">
      <button class="reject" id="reject">✕</button>
      <button class="accept" id="accept">✓</button>
    </div>

    <div class="call-actions" id="activeActions" style="display:none">
      <button class="reject" id="hangup">✕</button>
    </div>
  </div>
</div>

<script>
const messages = document.querySelector("#messages");
const input = document.querySelector("#input");
const form = document.querySelector("#form");
const streamVideo = document.querySelector("#callVideo");

const newMessageModal = document.querySelector("#newMessageModal");
const menuModal = document.querySelector("#menuModal");
const callModal = document.querySelector("#callModal");

let mediaStream = null;

document.querySelector("#date").textContent =
  new Date().toLocaleDateString("zh-CN",{
    month:"long",
    day:"numeric",
    weekday:"short"
  }) + " " + new Date().toLocaleTimeString("zh-CN",{
    hour:"2-digit",
    minute:"2-digit"
  });

function show(modal){
  modal.classList.add("show");
}

function hide(modal){
  modal.classList.remove("show");
}

document.querySelector("#back").onclick = () => {
  if(history.length > 1){
    history.back();
  }else{
    alert("已经是首页");
  }
};

document.querySelector("#plus").onclick = () => show(menuModal);

document.querySelector("#newMessage").onclick = () => {
  hide(menuModal);
  show(newMessageModal);
};

document.querySelector("#createMessage").onclick = () => {
  const name = document.querySelector("#newName").value.trim();
  const number = document.querySelector("#newNumber").value.trim();

  if(!name || !number){
    alert("请输入联系人名称和手机号码");
    return;
  }

  document.querySelector("#contactNumber").textContent = number;
  messages.innerHTML = "";
  hide(newMessageModal);
};

document.querySelectorAll("[data-close]").forEach(button => {
  button.onclick = () => {
    hide(document.querySelector("#" + button.dataset.close));
  };
});

form.onsubmit = event => {
  event.preventDefault();

  const text = input.value.trim();
  if(!text) return;

  const row = document.createElement("div");
  row.className = "row me";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  row.appendChild(bubble);
  messages.appendChild(row);

  input.value = "";
  messages.scrollTop = messages.scrollHeight;
};

async function openVideoCall(incoming=false){
  show(callModal);

  document.querySelector("#callTitle").textContent =
    incoming ? "视频来电" : "视频通话";

  document.querySelector("#callStatus").textContent =
    incoming ? "邀请你进行视频通话" : "正在请求摄像头权限";

  document.querySelector("#incomingActions").style.display =
    incoming ? "flex" : "none";

  document.querySelector("#activeActions").style.display =
    incoming ? "none" : "flex";

  if(!incoming){
    await acceptVideo();
  }
}

async function acceptVideo(){
  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({
      video:true,
      audio:true
    });

    streamVideo.srcObject = mediaStream;
    streamVideo.style.display = "block";

    document.querySelector("#callTitle").textContent = "视频通话中";
    document.querySelector("#callStatus").textContent = "摄像头和麦克风已开启";
    document.querySelector("#incomingActions").style.display = "none";
    document.querySelector("#activeActions").style.display = "flex";
  }catch(error){
    document.querySelector("#callStatus").textContent =
      "请允许使用摄像头和麦克风";
  }
}

function closeCall(){
  if(mediaStream){
    mediaStream.getTracks().forEach(track => track.stop());
    mediaStream = null;
  }

  streamVideo.srcObject = null;
  streamVideo.style.display = "none";
  hide(callModal);
}

document.querySelector("#startVideo").onclick = () => {
  openVideoCall(false);
};

document.querySelector("#voice").onclick = () => {
  openVideoCall(false);
};

document.querySelector("#incomingCall").onclick = () => {
  hide(menuModal);
  openVideoCall(true);
};

document.querySelector("#accept").onclick = () => {
  acceptVideo();
};

document.querySelector("#reject").onclick = closeCall;
document.querySelector("#hangup").onclick = closeCall;
</script>

</body>
</html>
